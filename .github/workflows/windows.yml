name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Upload the Windows preview executable (requires available artifact quota)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Screen full reachable Git history (counts only)
        shell: powershell
        run: |
          python ./scripts/audit-reachable-history.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'History audit self-test failed' }
          python ./scripts/audit-reachable-history.py
          if ($LASTEXITCODE -ne 0) { throw 'History screen requires review' }
      - name: Inspect legacy public release without executing or uploading assets
        if: ${{ github.repository == 'fostergd/disc_archiving_app' && github.ref == 'refs/heads/main' && github.event_name == 'push' && !github.event.repository.private }}
        shell: powershell
        run: |
          python ./scripts/audit-legacy-preview.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Legacy preview audit regression failed' }
          python ./scripts/audit-legacy-preview.py
          if ($LASTEXITCODE -ne 0) { throw 'Legacy preview identity review failed' }
      - run: rustup toolchain install 1.100.0-x86_64-pc-windows-msvc --profile minimal
      - name: Run attribution parser regression tests before dependency builds
        shell: powershell
        run: |
          python ./scripts/inspect-embedded-license-evidence.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Attribution parser regression failed' }
          python ./scripts/build-license-bundle.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Notice bundle regression failed' }
          python ./scripts/inspect-release-runtime.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Runtime evidence regression failed' }
          python ./scripts/inspect-rust-library-notices.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Rust library notice parser regression failed' }
      - name: Inventory exact Windows dependency licenses (no artifact upload)
        shell: powershell
        run: ./scripts/inventory-windows-licenses.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'das-license-review')
      - name: Collect and validate pinned upstream notice evidence (no upload)
        shell: powershell
        run: ./scripts/collect-windows-license-evidence.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'das-notice-evidence')
      - run: cargo test --locked --all-targets --features gui
      - name: Build locked release and capture Cargo build-script outputs
        shell: powershell
        run: |
          python ./scripts/inspect-embedded-license-evidence.py --capture-release-build --build-messages (Join-Path $env:RUNNER_TEMP 'das-release-build.jsonl')
          if ($LASTEXITCODE -ne 0) { throw 'Locked release build failed' }
      - name: Inspect embedded fonts, SQLite and generated binding evidence (no upload)
        shell: powershell
        run: |
          python ./scripts/inspect-embedded-license-evidence.py --build-messages (Join-Path $env:RUNNER_TEMP 'das-release-build.jsonl') --output-directory (Join-Path $env:RUNNER_TEMP 'das-embedded-evidence')
          if ($LASTEXITCODE -ne 0) { throw 'Embedded attribution evidence failed' }
      - name: Inspect actual compiled dependency candidates and executable imports
        shell: powershell
        run: |
          python ./scripts/inspect-release-runtime.py --build-messages (Join-Path $env:RUNNER_TEMP 'das-release-build.jsonl') --output (Join-Path $env:RUNNER_TEMP 'das-runtime-evidence.json')
          if ($LASTEXITCODE -ne 0) { throw 'Runtime evidence inspection failed' }
      - name: Inspect pinned Rust standard library copyright declarations
        shell: powershell
        run: |
          python ./scripts/inspect-rust-library-notices.py
          if ($LASTEXITCODE -ne 0) { throw 'Rust library copyright review failed' }
      - name: Assemble and validate review-only license bundle (no upload)
        shell: powershell
        run: |
          python ./scripts/build-license-bundle.py --notice-directory (Join-Path $env:RUNNER_TEMP 'das-notice-evidence') --embedded-report (Join-Path $env:RUNNER_TEMP 'das-embedded-evidence/embedded-evidence.json') --output (Join-Path $env:RUNNER_TEMP 'THIRD_PARTY_LICENSES.zip')
          if ($LASTEXITCODE -ne 0) { throw 'Review notice bundle validation failed' }
      - run: target/release/disc-archive.exe --help
      - name: Verify GUI executable exists
        run: if (-not (Test-Path target/release/disc-archive-studio.exe)) { throw 'GUI executable missing' }
      - name: Assemble and validate portable preview
        shell: powershell
        run: |
          ./scripts/build-and-test-portable.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'das-portable') -NoticeBundle (Join-Path $env:RUNNER_TEMP 'THIRD_PARTY_LICENSES.zip')
          ./scripts/new-preview-zip.ps1 -PackageDirectory (Join-Path $env:RUNNER_TEMP 'das-portable') -OutputDirectory (Join-Path $env:RUNNER_TEMP 'das-zip-validation') -RequireNoticeBundle
      - name: Publish requested preview
        if: ${{ github.event.repository.private && github.event_name == 'workflow_dispatch' && inputs.publish_preview }}
        uses: actions/upload-artifact@v4
        with:
          name: disc-archive-windows-x64-preview
          path: ${{ runner.temp }}/das-portable
          if-no-files-found: error
          retention-days: 3
