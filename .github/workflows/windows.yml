name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Upload the Windows preview executable (requires available artifact quota)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: rustup default stable-x86_64-pc-windows-msvc
      - run: cargo test --all-targets --features gui
      - run: cargo build --release --features gui
      - run: target/release/disc-archive.exe --help
      - name: Verify GUI executable exists
        run: if (-not (Test-Path target/release/disc-archive-studio.exe)) { throw 'GUI executable missing' }
      - name: Assemble and validate portable preview
        shell: powershell
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'das-portable'
          ./scripts/package-windows.ps1 -Destination $dest
          $expected = @('disc-archive.exe','disc-archive-studio.exe','README.md','WINDOWS_ACCEPTANCE.md','SHA256SUMS.txt')
          foreach ($name in $expected) {
            if (-not (Test-Path -LiteralPath (Join-Path $dest $name) -PathType Leaf)) { throw "Missing package file: $name" }
          }
          $lines = @(Get-Content -LiteralPath (Join-Path $dest 'SHA256SUMS.txt'))
          if ($lines.Count -ne 4) { throw 'Unexpected checksum count' }
          foreach ($name in $expected[0..3]) {
            $hash = (Get-FileHash -LiteralPath (Join-Path $dest $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($lines -cnotcontains "$hash  $name") { throw "Checksum mismatch: $name" }
          }
          $rejected = $false
          try { ./scripts/package-windows.ps1 -Destination $dest } catch { $rejected = $true }
          if (-not $rejected) { throw 'Existing package destination was accepted' }
          & (Join-Path $dest 'disc-archive.exe') --help
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI failed' }
      - name: Publish requested preview
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_preview }}
        uses: actions/upload-artifact@v4
        with:
          name: disc-archive-windows-x64-preview
          path: ${{ runner.temp }}/das-portable
          if-no-files-found: error
          retention-days: 3
