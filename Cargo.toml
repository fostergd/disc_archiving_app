[package]
name = "disc-archive"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
globset = "0.4"
sha2 = "0.10"
anyhow = "1"

[features]
default = []
gui = ["dep:eframe", "dep:rfd"]

[dependencies.eframe]
version = "0.31.1"
optional = true
default-features = false
features = ["default_fonts", "glow"]

[dependencies.rfd]
version = "0.15"
optional = true

[[bin]]
name = "disc-archive-studio"
path = "src/bin/studio.rs"
required-features = ["gui"]

[dev-dependencies]
tempfile = "3"
